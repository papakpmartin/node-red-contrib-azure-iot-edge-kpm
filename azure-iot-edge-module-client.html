<script type="text/x-red" data-help-name="modulemethod">
    <p>Azure IoT Edge Module Method node enables you to respond to methods sent by Azure IoT Hub by means of running in a Node-RED instance that is running as a module in an Azure IoT Edge deployment.</p>
    <p>The "method" setting will determine what method request this node is listening for and expecting to respond to. This will be availble at this node’s output.</p>
    <p>The request message includes <code>msg.requestId</code>. Preserve that value through the flow and return it with <code>msg.status</code> (an HTTP-style status from 100 through 599) and a JSON-compatible <code>msg.payload</code>. Requests time out after 25 seconds.</p>
</script>
