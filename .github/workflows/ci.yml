name: CI

on:
  pull_request:
  push:
    branches:
      - modernize
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm test
