<script type="text/javascript">
    RED.nodes.registerType('device-client', {
        category: 'config',
        icon: "iot-edge-module-logo.svg",
        color: '#3cd37b',
        defaults: {
            module: {
                value: ""
            }
        },
        label: function() {
            return "Device Client";
        }
    });
</script>

<script type="text/x-red" data-template-name="device-client">
    <p>
        You do not need to set any properties for this client. It creates a direct IoT Hub device connection using the configured X.509 identity and certificate files.
    </p>
    <p>
        Configure <code>IOTEDGE_IOTHUBHOSTNAME</code>, <code>IOTEDGE_DEVICEID</code>, <code>PATH_TO_CERTIFICATE_FILE</code>, and <code>PATH_TO_KEY_FILE</code>. See the README for deployment and rotation guidance.
    </p>
</script>

<script type="text/x-red" data-help-name="device-client">
    <p>
        This configuration node connects directly to Azure IoT Hub as the configured device identity using an X.509 certificate and private key. It is separate from the Edge module workload identity.
    </p>
    <p>
        This configuration will be used by the other nodes in this package to interact with Azure IoT Hub.
    </p>
</script>
<!-- <p style="color:#82e3aa"> -->
<script type="text/javascript">
    RED.nodes.registerType('device-twin', {
        category: 'Azure IoT Edge',
        color: '#3cd37b',
        defaults: {
            client: {
                value: "",
                type: "device-client",
                required: true
            }
        },
        inputs: 1,
        outputs: 1,
        icon: "iot-edge-module-logo.svg",
        label: function() {
            return "Device Twin";
        },
        paletteLabel: function() {
            return "Device Twin";
        },
    });
</script>

<script type="text/x-red" data-template-name="device-twin">
    <div class="form-row">
        <label for="node-input-client"><i class="icon-tag"></i> <span>Device Client</span></label>
        <input type="text" id="node-input-client" placeholder="Client">
    </div>
</script>

<script type="text/x-red" data-help-name="device-twin">
    <p>Azure IoT Edge Device Twin receives desired properties changes and sends reported properties to Azure IoT Edge using Node-RED. Node-RED needs to run as a module in Azure IoT Edge for this node to work.</p>
    <p>The input of the node sends reported properties to the device twin and the output represents changes to desired properties.</p>
</script>
